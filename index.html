<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Counter</title>
        <link rel ="stylesheet" href="css/style.css">
        <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Health Tracker App</title>
    </head>
    <body>
        <main>
            <div class="first">
            <h1>Save Your Favourite Number</h1>
            <h2 id="counter">0</h2>
            </div>
         <div class="btn">
            <div class="innerbtn">
             <button class="increament"  onclick="increament()">Increament</button>
            </div>
            <div class="innerbtn">
             <button class="decreament" id="decrease" onclick="decreament()">Decreament</button>
            </div>
            <div class="innerbtn">
             <button class="reset" id="reset" onclick="reset()">Reset</button>
            </div>
            <div class="innerbtn">
             <button class="saved" id="saved" onclick="saved()">Saved</button>
              <script src="js/first.js"></script>
            </div>
            </div>
        </main>
    </body>
</html>
